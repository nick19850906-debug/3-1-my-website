server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # (A) 브라우저 접속: http://<퍼블릭IP>/ -> 200 OK 및 웹 페이지 반환
    location / {
        try_files $uri $uri/ /index.html;
    }

    # (B) 헬스체크 호출: GET http://<퍼블릭IP>/health -> 200 OK 및 고정 문구 "OK" 반환
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # JSON 상태 확인용 추가 엔드포인트
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"OK","region":"ap-northeast-2","service":"codyssey-cloud-web"}\n';
    }
}

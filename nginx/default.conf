# ==============================================================================
# [파일 이름] nginx/default.conf (웹 서버 핵심 라우팅 설정 파일)
# [실생활 비유] 건물 1층 안내 데스크(80번 출입구) 직원이 방문객의 목적지('/' 로비 화면 vs
#              '/health' 생존 확인실)에 따라 알맞은 안내를 해주는 '안내 매뉴얼'입니다.
# ==============================================================================

# [1구역: 웹 서버 출입구(80번 포트) 및 기본 자료실 서랍장 위치 설정]
server {
    # listen 80: IPv4 주소로 들어오는 웹 표준 80번 포트(HTTP) 문을 열어두고 손님을 기다립니다.
    listen 80;
    # listen [::]:80: IPv6 주소([::])의 80번 포트 문도 함께 열어둡니다.
    listen [::]:80;

    # server_name _: '_'는 와일드카드(만능키)로, 도메인 주소든 EC2 퍼블릭 IP(http://43.201.142.88)든
    #                어떤 주소로 찾아와도 모두 이 서버가 받아주겠다는 뜻입니다.
    server_name _;

    # root: 손님에게 보여줄 홈페이지 파일(HTML)들이 보관된 기본 서랍장 폴더 경로입니다.
    root /usr/share/nginx/html;
    # index: 손님이 뒤에 파일 이름을 안 적고 'http://43.201.142.88/' 처럼 주소만 쳤을 때
    #        가장 먼저 꺼내서 보여줄 대표 파일 이름(index.html)입니다.
    index index.html;

    # --------------------------------------------------------------------------
    # [2구역: 외부 접속 검증 방식 (A) — 브라우저로 http://<퍼블릭IP>/ 접속 시 처리]
    # --------------------------------------------------------------------------
    location / {
        # try_files: 손님이 요청한 주소($uri)에 맞는 파일이나 폴더($uri/)가 있는지 순서대로 찾아보고,
        #            없으면 최종적으로 대표 화면인 '/index.html'(Hello Cloud 대시보드)을 200 OK로 보여줍니다.
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # [3구역: 외부 접속 검증 방식 (B) — GET http://<퍼블릭IP>/health 호출 시 처리]
    # --------------------------------------------------------------------------
    # 'location = /health': 주소가 정확히(=) '/health'와 일치할 때 실행되는 전용 구역입니다.
    location = /health {
        # access_log off: 헬스체크는 수시로 호출되므로 접속 일지(로그)가 너무 많이 쌓이지 않게 기록을 끕니다.
        access_log off;
        # default_type text/plain: 응답이 복잡한 웹페이지(HTML)가 아니라 '깔끔한 순수 글자'임을 알립니다.
        default_type text/plain;
        # return 200 "OK\n": 하드디스크에서 파일을 찾을 필요 없이, 즉시 상태 코드 '200 (정상)'과
        #                    고정 문구 '"OK"'를 0.001초 만에 돌려줍니다. (미션 PDF 방식 B 완벽 충족!)
        return 200 "OK\n";
    }

    # --------------------------------------------------------------------------
    # [4구역: (부가 기능) 상세 JSON 상태 확인용 엔드포인트 (/healthz)]
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"OK","region":"ap-northeast-2","service":"codyssey-cloud-web"}\n';
    }
}

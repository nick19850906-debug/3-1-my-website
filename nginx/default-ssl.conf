# 보너스 과제 1: Let's Encrypt HTTPS 인증서 적용 Nginx 설정
server {
    listen 80;
    listen [::]:80;
    server_name codyssey-web.duckdns.org;

    # ACME Challenge (Let's Encrypt 인증서 발급/갱신 경로)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP(80) 요청을 HTTPS(443)로 301 영구 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codyssey-web.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/codyssey-web.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codyssey-web.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
